name: Database Migration CI

on:
  pull_request:
    paths:
      - 'database/migrations/**'
      - 'database/scripts/**'
      - 'database/seeds/**'
      - 'database/tests/**'
      - 'compose.yaml'
      - '.github/workflows/database-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'database/migrations/**'
      - 'database/scripts/**'
      - 'database/seeds/**'
      - 'database/tests/**'
      - 'compose.yaml'
      - '.github/workflows/database-ci.yml'

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MYSQL_DATABASE: dabuchi_test
      MYSQL_USER: dabuchi_test
      MYSQL_PASSWORD: test-only-password
      MYSQL_ROOT_PASSWORD: test-only-root-password
      MYSQL_PORT: 0
      COMPOSE_PROJECT_NAME: dabuchi-db-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run migration tests
        run: bash database/tests/run.sh
