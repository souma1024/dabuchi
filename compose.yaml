name: dabuchi

services:
  frontend:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - .:/workspace
      - frontend-node-modules:/workspace/node_modules
    ports:
      # 既定はこのマシンからのみ。実機で確認したいときだけ DEV_BIND_ADDRESS を
      # 端末から届くアドレス（例: TailscaleのIP）にする。0.0.0.0にすると
      # 同じネットワークの誰からでも開けるため、既定にはしない。
      - '${DEV_BIND_ADDRESS:-127.0.0.1}:5173:5173'
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      VITE_API_PROXY_TARGET: http://backend:3000
      # Viteが受け付けるホスト名。Tailscale Funnelなどで公開するときだけ指定する。
      DEV_ALLOWED_HOSTS: ${DEV_ALLOWED_HOSTS:-}
    command: sh -c "npm ci && npm run dev --workspace frontend -- --host 0.0.0.0"
    depends_on:
      backend:
        condition: service_started

  backend:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - .:/workspace
      - backend-node-modules:/workspace/node_modules
    ports:
      # frontendの /api プロキシはcompose内部で完結するため、実機確認では公開不要。
      # APIを直接叩いて確かめたいときのために、frontendと同じ設定へ揃える。
      - '${DEV_BIND_ADDRESS:-127.0.0.1}:3000:3000'
    environment:
      PORT: 3000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      NODE_ENV: ${NODE_ENV:-development}
    command: sh -c "npm ci && npm run dev:container --workspace backend"
    depends_on:
      migrate:
        condition: service_completed_successfully

  mysql:
    image: mysql:8.4.10
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - '127.0.0.1:${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping --host=127.0.0.1 --user=root --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  migrate:
    image: flyway/flyway:13.1.0
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}?allowPublicKeyRetrieval=true&useSSL=false
      FLYWAY_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      FLYWAY_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./database/migrations:/flyway/sql:ro
    command: migrate
    restart: 'no'

volumes:
  frontend-node-modules:
  backend-node-modules:
  mysql-data:
